<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOV 1st DP guideline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --city-hunter-blue: #0725b0;
      --modest-white: #e5ded4;
      --birdhouse-brown: #6b4a3a;
      --nano-white: #f2efea;
      --brownish-black: #3e3a36;
      --white: #ffffff;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow: 0 10px 30px rgba(62, 58, 54, 0.08);
      --max: 1180px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Poppins", system-ui, sans-serif;
      background: var(--nano-white);
      color: var(--brownish-black);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Sticky nav */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(242, 239, 234, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(107, 74, 58, 0.12);
    }

    .sticky-nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-brand {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--city-hunter-blue);
      margin-right: auto;
      letter-spacing: 0.02em;
    }

    .nav-chip {
      appearance: none;
      border: none;
      text-decoration: none;
      font-family: "Poppins", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--modest-white);
      color: var(--birdhouse-brown);
      transition: background 0.2s, color 0.2s, transform 0.15s;
      cursor: pointer;
    }

    .nav-chip:hover {
      background: var(--city-hunter-blue);
      color: var(--white);
      transform: translateY(-1px);
    }

    /* Page shell */
    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero title band */
    .hero-band {
      background: var(--city-hunter-blue);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero-band::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 20%, rgba(255,255,255,0.08) 0 40%, transparent 41%),
        radial-gradient(circle at 88% 70%, rgba(255,255,255,0.06) 0 35%, transparent 36%);
      pointer-events: none;
    }

    .hero-kicker {
      font-family: "Poppins", sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 12px;
      position: relative;
    }

    .hero-title {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: 0.01em;
      position: relative;
    }

    .hero-sub {
      margin-top: 14px;
      font-size: 0.95rem;
      opacity: 0.9;
      position: relative;
    }

    /* Section label */
    .section-label {
      font-family: "Fredoka", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--city-hunter-blue);
      margin-bottom: 14px;
    }

    /* Overview chips (logo-variation style) */
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .chip-card {
      border-radius: var(--radius-md);
      padding: 28px 22px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .chip-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(62, 58, 54, 0.12);
    }

    .chip-card.blue {
      background: var(--city-hunter-blue);
      color: var(--white);
    }

    .chip-card.cream {
      background: var(--modest-white);
      color: var(--city-hunter-blue);
      border: 2px solid rgba(7, 37, 176, 0.08);
    }

    .chip-card.brown {
      background: var(--birdhouse-brown);
      color: var(--white);
    }

    .chip-card.nano {
      background: var(--white);
      color: var(--city-hunter-blue);
      border: 2px solid rgba(7, 37, 176, 0.12);
    }

    .chip-tag {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .chip-title {
      font-family: "Fredoka", sans-serif;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.15;
    }

    .chip-meta {
      font-size: 0.82rem;
      opacity: 0.85;
    }

    /* Palette strip */
    .palette-band {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px 28px;
    }

    .palette-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 22px;
      flex: 1;
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .swatch-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(62, 58, 54, 0.08);
      flex-shrink: 0;
    }

    .swatch-name {
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .swatch-hex {
      font-size: 0.68rem;
      color: var(--birdhouse-brown);
      opacity: 0.85;
      font-family: ui-monospace, monospace;
    }

    /* Type band */
    .type-band {
      background: var(--city-hunter-blue);
      color: var(--white);
      border-radius: var(--radius-md);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      box-shadow: var(--shadow);
    }

    .type-sample .aa {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 4px;
    }

    .type-sample.display .aa { font-family: "Fredoka", sans-serif; font-weight: 700; }
    .type-sample.body .aa { font-family: "Poppins", sans-serif; font-weight: 600; }

    .type-sample .name {
      font-family: "Fredoka", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .type-sample .role {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* Application tabs */
    .app-tabs {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .tab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: var(--modest-white);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      border: 1px solid rgba(107, 74, 58, 0.12);
      border-bottom: none;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .tab-btn {
      appearance: none;
      border: none;
      font-family: "Fredoka", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      background: transparent;
      color: var(--birdhouse-brown);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .tab-btn:hover {
      background: rgba(7, 37, 176, 0.08);
      color: var(--city-hunter-blue);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--city-hunter-blue);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(7, 37, 176, 0.28);
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--city-hunter-blue);
      outline-offset: 2px;
    }

    .tab-panels {
      background: transparent;
    }

    .panel {
      background: var(--white);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: visible;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(107, 74, 58, 0.12);
      border-top: none;
    }

    .panel[hidden] {
      display: none !important;
    }

    .panel-main {
      /* full-width active tab */
    }

    .panel-head {
      padding: 18px 22px 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(62, 58, 54, 0.08);
    }

    .panel-head h2 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--city-hunter-blue);
    }

    .panel-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--modest-white);
      color: var(--birdhouse-brown);
    }

    .panel-badge.live {
      background: rgba(7, 37, 176, 0.1);
      color: var(--city-hunter-blue);
    }

    .panel-badge.wait {
      background: rgba(107, 74, 58, 0.12);
      color: var(--birdhouse-brown);
    }

    .panel-body {
      padding: 18px 22px 28px;
      flex: 1;
      overflow: visible;
    }

    /* Stage wrap — side gutters so left/right tooltips aren’t clipped */
    .stage-wrap {
      padding: 8px 64px 16px;
      overflow: visible;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Hotspot stage */
    .hotspot-stage {
      position: relative;
      width: 100%;
      border-radius: var(--radius-md);
      overflow: visible;
      background: var(--nano-white);
      border: 1px solid rgba(62, 58, 54, 0.06);
      aspect-ratio: 1152 / 864;
    }

    .hotspot-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      border-radius: var(--radius-md);
    }







    .store-block-primary {
      grid-column: 1 / -1;
    }

    .store-block .panel-badge {
      display: inline-block;
      margin-bottom: 2px;
    }

    .store-grid.stack {
      grid-template-columns: 1fr;
    }

    .store-grid.stack .store-block + .store-block {
      border-left: none;
      border-top: 1px solid rgba(62, 58, 54, 0.1);
    }

    .hotspot {
      position: absolute;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0;
      margin: 0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      z-index: 2;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(7, 37, 176, 0.18);
      border-color: var(--city-hunter-blue);
      box-shadow: 0 0 0 3px rgba(7, 37, 176, 0.15);
      outline: none;
    }

    .hotspot-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--city-hunter-blue);
      border: 2px solid var(--white);
      box-shadow: 0 2px 6px rgba(7, 37, 176, 0.35);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }

    .hotspot:hover .hotspot-dot,
    .hotspot:focus-visible .hotspot-dot {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }

    .tooltip {
      position: absolute;
      z-index: 10;
      min-width: 180px;
      max-width: 240px;
      background: var(--white);
      color: var(--brownish-black);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 12px 28px rgba(62, 58, 54, 0.18);
      border: 1px solid rgba(7, 37, 176, 0.12);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      font-size: 0.8rem;
    }

    .hotspot:hover .tooltip,
    .hotspot:focus-visible .tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-role, .tooltip-name { display: block; }
    .tooltip-role {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--city-hunter-blue);
      margin-bottom: 2px;
    }

    .tooltip-name {
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .tooltip-sku {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      background: var(--nano-white);
      color: var(--birdhouse-brown);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    /* Position tooltips so they stay in frame */
    .tooltip.above { bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 6px); }
    .hotspot:hover .tooltip.above,
    .hotspot:focus-visible .tooltip.above { transform: translate(-50%, 0); }

    .tooltip.below { top: calc(100% + 10px); left: 50%; transform: translate(-50%, -6px); }
    .hotspot:hover .tooltip.below,
    .hotspot:focus-visible .tooltip.below { transform: translate(-50%, 0); }

    .tooltip.left { right: calc(100% + 10px); top: 50%; transform: translate(6px, -50%); }
    .hotspot:hover .tooltip.left,
    .hotspot:focus-visible .tooltip.left { transform: translate(0, -50%); }

    .tooltip.right { left: calc(100% + 10px); top: 50%; transform: translate(-6px, -50%); }
    .hotspot:hover .tooltip.right,
    .hotspot:focus-visible .tooltip.right { transform: translate(0, -50%); }

    .hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--birdhouse-brown);
    }

    /* SKU tables */
    .sku-block { margin-top: 20px; }

    .sku-block h3 {
      font-family: "Fredoka", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--brownish-black);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-pill {
      font-family: "Poppins", sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--city-hunter-blue);
      color: var(--white);
    }

    .role-pill.m { background: var(--birdhouse-brown); }

    .sku-note {
      font-size: 0.75rem;
      color: var(--birdhouse-brown);
      margin-bottom: 10px;
      opacity: 0.9;
    }

    table.sku-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      background: var(--nano-white);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    table.sku-table th,
    table.sku-table td {
      text-align: center;
      padding: 9px 11px;
      border-bottom: 1px solid rgba(62, 58, 54, 0.08);
      vertical-align: middle;
    }

    table.sku-table th {
      background: var(--modest-white);
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--birdhouse-brown);
    }

    table.sku-table tr:last-child td { border-bottom: none; }

    table.sku-table code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      color: var(--city-hunter-blue);
      background: rgba(7, 37, 176, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    table.sku-table .cat {
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--birdhouse-brown);
      white-space: nowrap;
      width: 7.5rem;
    }

    table.sku-table th.sku-col,
    table.sku-table td.sku-col {
      width: 11.5rem;
    }

    /* Placeholder panels */
    .placeholder-art {
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-md);
      background:
        repeating-linear-gradient(
          -45deg,
          var(--modest-white),
          var(--modest-white) 12px,
          #ebe4da 12px,
          #ebe4da 24px
        );
      border: 2px dashed rgba(107, 74, 58, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 8px;
      color: var(--birdhouse-brown);
      position: relative;
    }

    .placeholder-art .icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(7, 37, 176, 0.1);
      color: var(--city-hunter-blue);
      display: grid;
      place-items: center;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .placeholder-art strong {
      font-family: "Fredoka", sans-serif;
      font-size: 1rem;
      color: var(--brownish-black);
    }

    .placeholder-art span {
      font-size: 0.78rem;
      max-width: 200px;
    }

    .disabled-note {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--birdhouse-brown);
      font-style: italic;
    }

    /* DP setting band */
    .dp-band {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .dp-band-head {
      background: var(--modest-white);
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .dp-band-head h2 {
      font-family: "Fredoka", sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--city-hunter-blue);
    }

    .dp-band-head p {
      font-size: 0.82rem;
      color: var(--birdhouse-brown);
    }

    .store-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .store-block {
      padding: 22px 24px 26px;
    }

    .store-block + .store-block {
      border-left: 1px solid rgba(62, 58, 54, 0.1);
    }

    .store-title {
      font-family: "Fredoka", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--brownish-black);
    }

    .store-meta {
      font-size: 0.75rem;
      color: var(--birdhouse-brown);
      margin-bottom: 14px;
    }

    /* Footer */
    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--birdhouse-brown);
      padding: 8px 0 0;
    }

    .footer-note code {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      background: var(--modest-white);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .chip-grid { grid-template-columns: 1fr 1fr; }
      .store-grid { grid-template-columns: 1fr; }
      .store-block + .store-block {
        border-left: none;
        border-top: 1px solid rgba(62, 58, 54, 0.1);
      }
      .type-band { grid-template-columns: 1fr; }
      .stage-wrap { padding: 8px 40px 14px; }
    }

    @media (max-width: 640px) {
      .chip-grid { grid-template-columns: 1fr; }
      .page { padding: 16px 14px 60px; gap: 18px; }
      .hero-band { padding: 36px 22px 32px; border-radius: 22px; }
      .sticky-nav-inner { padding: 10px 14px; }
      .nav-brand { width: 100%; margin-bottom: 4px; }
      .stage-wrap { padding: 6px 28px 12px; }
      .tab-btn { padding: 10px 16px; font-size: 0.88rem; }
      .panel-body { padding: 14px 14px 22px; }
    }
  
    /* ===== NOV additions: store-group tabs ===== */
    .group-list {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .group-btn {
      appearance: none; border: 2px solid rgba(7, 37, 176, 0.14);
      font-family: "Fredoka", sans-serif; font-size: 1.05rem; font-weight: 600;
      padding: 12px 24px; border-radius: var(--radius-md);
      background: var(--white); color: var(--city-hunter-blue); cursor: pointer;
      box-shadow: var(--shadow); letter-spacing: 0.03em;
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      transition: background 0.18s, color 0.18s, transform 0.15s;
    }
    .group-btn small {
      font-family: "Poppins", sans-serif; font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75;
    }
    .group-btn:hover { transform: translateY(-2px); }
    .group-btn[aria-selected="true"] {
      background: var(--city-hunter-blue); color: var(--white); border-color: var(--city-hunter-blue);
    }
    .group-btn:focus-visible { outline: 2px solid var(--city-hunter-blue); outline-offset: 3px; }
    .group-panel[hidden] { display: none !important; }
    .group-intro {

    { key: "main",  label: "Main",  title: "Main Mannequin" },

  /* ================================================================ */
  (function () {
    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function skuText(it) { return it.color ? it.sku + " · color " + it.color : (it.note ? it.sku + " · " + it.note : it.sku); }
    function skuHtml(it) {
      return "<code>" + esc(it.sku) + "</code>" + (it.color ? '<span class="tbc">Color ' + esc(it.color) + "</span>" : "") +
        (it.note ? '<span class="note-tag">' + esc(it.note) + "</span>" : "");
    }

    function hotspot(fig, it) {
      var b = it.box;
      return '<button type="button" class="hotspot" style="left:' + b[0] + "%; top:" + b[1] + "%; width:" + b[2] + "%; height:" + b[3] + '%;"' +
        ' data-sku="' + esc(skuText(it)) + '" data-name="' + esc(it.name) + '" data-role="' + esc(fig.role) + '"' +
        ' aria-label="SKU: ' + esc(it.name) + '">' +
        '<span class="hotspot-dot" aria-hidden="true"></span>' +
        '<span class="tooltip ' + fig.side + '">' +
        '<span class="tooltip-role">' + esc(fig.role) + " · " + esc(it.cat) + "</span>" +
        '<span class="tooltip-name">' + esc(it.name) + "</span>" +
        '<span class="tooltip-sku">' + esc(skuText(it)) + "</span>" +
        "</span></button>";
    }

    function hotspotOrder(fig) {
      // big boxes first so smaller, nested boxes (sweater, bandana, keyring) stay on top
      return fig.items.slice().sort(function (a, b) { return b.box[2] * b.box[3] - a.box[2] * a.box[3]; });
    }

    function livePanel(g, slot, m) {
      var storeNote = m.storeNote ? '<p class="store-note">' + esc(m.storeNote) +
        (m.storeNoteImage ? ' <a href="' + esc(m.storeNoteImage) + '" target="_blank" rel="noopener">View M11 shoe variant image</a>' : "") + "</p>" : "";
      var spots = m.figures.map(function (f) { return hotspotOrder(f).filter(function (it) { return !it.noSpot; }).map(function (it) { return hotspot(f, it); }).join(""); }).join("");
      var tables = m.figures.map(function (f) {
        return '<div class="sku-block"><h3><span class="role-pill' + (f.pill === "M" ? " m" : "") + '">' + f.pill + "</span> " +
          esc(f.role) + " · " + esc(f.where) + (f.height ? " · " + esc(f.height) : "") + "</h3>" +
          '<p class="sku-note">By category · SKU first for store follow-up</p>' +
          '<table class="sku-table"><thead><tr><th>Category</th><th class="sku-col">SKU</th><th>Item</th></tr></thead><tbody>' +
          f.items.map(function (it) {
            return '<tr><td class="cat">' + esc(it.cat) + '</td><td class="sku-col">' + skuHtml(it) + "</td><td>" + esc(it.name) + "</td></tr>";
          }).join("") + "</tbody></table></div>";
      }).join("");
      var notes = '<div class="notes-grid">' + m.figures.map(function (f) {
        return '<div class="notes-card"><h3><span class="role-pill' + (f.pill === "M" ? " m" : "") + '">' + f.pill + "</span> " +
          esc(f.role) + " styling notes</h3><ul>" +
          f.notes.map(function (n) { return "<li><b>" + esc(n[0]) + ":</b> " + esc(n[1]) + "</li>"; }).join("") + "</ul></div>";
      }).join("") + "</div>";
      return '<div class="panel-head"><h2>' + slot.title + '</h2><span class="panel-badge live">' + esc(m.badge || "Live") + "</span></div>" +
        '<div class="panel-body"><div class="stage-wrap"><div class="hotspot-stage" style="aspect-ratio:' + m.imageW + " / " + m.imageH + '" aria-label="' + esc(g.label + " " + slot.title) + ' with SKU hotspots">' +
        '<img src="' + esc(m.image) + '" alt="' + esc(m.alt) + '" width="' + m.imageW + '" height="' + m.imageH + '" />' +
        spots + '</div></div><p class="hint">Hover or focus apparel to reveal SKU</p>' + storeNote + notes + tables + "</div>";
    }

    function soonPanel(g, slot) {
      return '<div class="panel-head"><h2>' + slot.title + '</h2><span class="panel-badge wait">Coming soon</span></div>' +
        '<div class="panel-body"><div class="placeholder-art wide"><div class="icon">' + slot.label.charAt(0) + "</div>" +
        "<strong>" + slot.title + " · coming soon</strong><span>Look for " + esc(g.stores) + " not released yet — SKUs and image will be added here.</span></div></div>";
    }

    var groupList = document.getElementById("group-list");
    var groupPanels = document.getElementById("group-panels");
    var navInner = document.getElementById("nav-inner");
    var images = [];

    STORE_GROUPS.forEach(function (g, gi) {
      var liveCount = MANNEQUIN_SLOTS.filter(function (s) { return g.mannequins[s.key] && g.mannequins[s.key].status === "live"; }).length;
      groupList.insertAdjacentHTML("beforeend",
        '<button type="button" class="group-btn" role="tab" id="gtab-' + g.id + '" aria-controls="group-' + g.id + '" data-group="' + g.id + '">' +
        "<small>Store group " + String(gi + 1).padStart(2, "0") + " · " + liveCount + "/" + MANNEQUIN_SLOTS.length + " live</small>" + esc(g.label) + "</button>");
      navInner.insertAdjacentHTML("beforeend", '<a class="nav-chip" href="#' + g.id + '" data-group="' + g.id + '">' + esc(g.label) + "</a>");

      var tabs = "", panels = "";
      MANNEQUIN_SLOTS.forEach(function (slot) {
        var m = g.mannequins[slot.key] || { status: "soon" };
        var pid = g.id + "-" + slot.key;
        tabs += '<button type="button" class="tab-btn" role="tab" id="tab-' + pid + '" aria-controls="' + pid + '" data-slot="' + slot.key + '">' +
          slot.label + (m.status === "live" ? "" : '<span class="soon">Soon</span>') + "</button>";
        panels += '<article class="panel" role="tabpanel" id="' + pid + '" aria-labelledby="tab-' + pid + '" hidden>' +
          (m.status === "live" ? livePanel(g, slot, m) : soonPanel(g, slot)) + "</article>";
        if (m.status === "live" && images.indexOf(m.image) === -1) images.push(m.image);
      });
      groupPanels.insertAdjacentHTML("beforeend",
        '<div class="group-panel" role="tabpanel" id="group-' + g.id + '" aria-labelledby="gtab-' + g.id + '" hidden>' +
        '<p class="group-intro">Stores: <b>' + esc(g.stores) + "</b> · assortment specific to this group</p>" +
        '<div class="app-tabs"><div class="tab-list" role="tablist" aria-label="' + esc(g.label) + ' mannequins">' + tabs + "</div>" +
        '<div class="tab-panels">' + panels + "</div></div></div>");
    });

    document.getElementById("footer-note").innerHTML = "Self-contained guideline · images " +
      images.map(function (i) { return "<code>" + esc(i) + "</code>"; }).join(" · ");

    var state = {};  // groupId -> active slot
    function firstLive(g) {
      for (var i = 0; i < MANNEQUIN_SLOTS.length; i++) {
        var m = g.mannequins[MANNEQUIN_SLOTS[i].key];
        if (m && m.status === "live") return MANNEQUIN_SLOTS[i].key;
      }
      return "main";
    }
    function findGroup(id) { return STORE_GROUPS.filter(function (g) { return g.id === id; })[0]; }

    function activate(groupId, slotKey, opts) {
      opts = opts || {};
      var g = findGroup(groupId) || STORE_GROUPS[0];
      slotKey = slotKey || state[g.id] || firstLive(g);
      state[g.id] = slotKey;
      STORE_GROUPS.forEach(function (x) {
        var sel = x.id === g.id;
        var b = document.getElementById("gtab-" + x.id);
        b.setAttribute("aria-selected", sel ? "true" : "false"); b.tabIndex = sel ? 0 : -1;
        document.getElementById("group-" + x.id).hidden = !sel;
      });
      MANNEQUIN_SLOTS.forEach(function (s) {
        var pid = g.id + "-" + s.key, sel = s.key === slotKey;
        var t = document.getElementById("tab-" + pid);
        t.setAttribute("aria-selected", sel ? "true" : "false"); t.tabIndex = sel ? 0 : -1;
        document.getElementById(pid).hidden = !sel;
      });
      if (opts.updateHash && history.replaceState) history.replaceState(null, "", "#" + g.id + "-" + slotKey);
      if (opts.scroll) document.getElementById("application").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function fromHash() {
      var h = (location.hash || "").replace(/^#/, "");
      for (var i = 0; i < STORE_GROUPS.length; i++) {
        var g = STORE_GROUPS[i];
        if (h === g.id) return [g.id, null];
        for (var j = 0; j < MANNEQUIN_SLOTS.length; j++) if (h === g.id + "-" + MANNEQUIN_SLOTS[j].key) return [g.id, MANNEQUIN_SLOTS[j].key];
      }
      return null;
    }

    function arrowNav(list, el, e, cb) {
      var i = list.indexOf(el), n = -1;
      if (e.key === "ArrowRight") n = (i + 1) % list.length;
      if (e.key === "ArrowLeft") n = (i - 1 + list.length) % list.length;
      if (e.key === "Home") n = 0;
      if (e.key === "End") n = list.length - 1;
      if (n >= 0) { e.preventDefault(); list[n].focus(); cb(list[n]); }
    }

    var gBtns = Array.prototype.slice.call(document.querySelectorAll(".group-btn"));
    gBtns.forEach(function (b) {
      b.addEventListener("click", function () { activate(b.dataset.group, null, { updateHash: true }); });
      b.addEventListener("keydown", function (e) { arrowNav(gBtns, b, e, function (x) { activate(x.dataset.group, null, { updateHash: true }); }); });
    });
    document.querySelectorAll(".group-panel").forEach(function (gp) {
      var gid = gp.id.replace(/^group-/, "");
      var tBtns = Array.prototype.slice.call(gp.querySelectorAll(".tab-btn"));
      tBtns.forEach(function (t) {
        t.addEventListener("click", function () { activate(gid, t.dataset.slot, { updateHash: true }); });
        t.addEventListener("keydown", function (e) { arrowNav(tBtns, t, e, function (x) { activate(gid, x.dataset.slot, { updateHash: true }); }); });
      });
    });
    document.querySelectorAll(".nav-chip[data-group]").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); activate(a.dataset.group, null, { updateHash: true, scroll: true }); });
    });
    window.addEventListener("hashchange", function () { var h = fromHash(); if (h) activate(h[0], h[1], { scroll: true }); });
    document.querySelectorAll(".hotspot").forEach(function (el) {
      el.addEventListener("keydown", function (e) { if (e.key === "Escape") el.blur(); });
    });

    var init = fromHash();
    activate(init ? init[0] : STORE_GROUPS[0].id, init ? init[1] : null, { scroll: !!init });
  })();
