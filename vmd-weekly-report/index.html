<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VMD Weekly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --ink-2:#1c1c1c;
    --cream:#ECE5DD;
    --cream-2:#E2D9CF;
    --pink:#F68BDA;
    --lime:#C8E64A;
    --purple:#9C7CF0;
    --muted:#6f6a64;
    --line:rgba(17,17,17,.14);
    --ratio:4/3;          /* ground rule: every photo uses the same frame */
    --display:'Anton','Impact','Arial Narrow Bold',sans-serif;
    --marker:'Permanent Marker','Comic Sans MS',cursive;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button,select{font:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px}
  .micro{font:800 11px/1.35 var(--body);letter-spacing:.06em;text-transform:uppercase}

  /* ---------- HERO ---------- */
  .hero{background:var(--cream);position:relative;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1fr auto;gap:24px;padding-top:40px;padding-bottom:34px;position:relative;z-index:1}
  .hero h1{font:400 clamp(56px,10vw,132px)/.86 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.005em}
  .hero h1 .u{display:inline-block;position:relative}
  .hero h1 .u::after{content:"";position:absolute;left:0;right:-4px;bottom:-.08em;height:.09em;background:var(--ink);border-radius:99px;transform:rotate(-.6deg)}
  .hero .side{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;text-align:right;gap:16px}
  .hero .tag-week{font:400 clamp(40px,6vw,76px)/.9 var(--display);color:var(--ink)}
  .hero .tag-week small{display:block;font:800 11px/1.3 var(--body);letter-spacing:.08em;margin-top:6px}
  .spray{position:absolute;pointer-events:none;z-index:0;opacity:.9}
  .hero .spray{right:18%;top:8%;width:min(520px,60vw)}
  .hero .scribble{position:absolute;right:16px;bottom:10px;font:400 clamp(28px,4vw,48px)/1 var(--marker);color:var(--pink);transform:rotate(-8deg);z-index:1;text-shadow:0 0 1px rgba(0,0,0,.05)}
  .hero .ast{font:400 64px/1 var(--display);color:var(--pink);position:absolute;left:min(56%,640px);top:22px;z-index:1}

  /* ---------- CONTROL BAR ---------- */
  .bar{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid #2a2a2a}
  .bar .wrap{display:flex;align-items:stretch;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;flex:1 1 auto}
  .tab{appearance:none;border:2px solid var(--cream);background:transparent;color:var(--cream);cursor:pointer;
       font:400 26px/1 var(--display);letter-spacing:.02em;padding:10px 26px 8px;min-width:120px;text-align:left;
       display:flex;align-items:baseline;justify-content:space-between;gap:16px;transition:background .15s,color .15s,border-color .15s}
  .tab .micro{font-size:10px;opacity:.75}
  .tab:hover{border-color:var(--pink);color:var(--pink)}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab[data-brand="MLB"][aria-selected="true"]{background:var(--lime);border-color:var(--lime)}
  .tab[data-brand="DX"][aria-selected="true"]{background:var(--purple);border-color:var(--purple)}
  .tab:focus-visible,.ctrl:focus-visible,.seg button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ctrl{background:var(--ink-2);color:var(--cream);border:1px solid #3a3a3a;padding:9px 12px;font:800 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .seg{display:flex;border:1px solid #3a3a3a}
  .seg button{background:transparent;color:#bdb6ae;border:0;padding:9px 12px;font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--pink);color:var(--ink)}

  /* ---------- SECTIONS ---------- */
  main{padding:28px 0 60px}
  .sec{margin-bottom:28px}
  .sec-head{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:18px;padding:22px 24px 20px;position:relative;overflow:hidden}
  .sec-head .num{font:400 15px/1 var(--display);letter-spacing:.05em;align-self:start;padding-top:6px}
  .sec-head h2{font:400 clamp(42px,6.4vw,84px)/.88 var(--display);text-transform:uppercase;margin:0}
  .sec-head h2 .u{position:relative;display:inline-block}
  .sec-head h2 .u::after{content:"";position:absolute;left:-2px;right:-6px;bottom:-.06em;height:.1em;border-radius:99px;background:currentColor;transform:rotate(-.8deg)}
  .sec-head .aside{text-align:right}
  .sec-head.floor{background:var(--cream)}
  .sec-head.project{background:var(--lime)}
  .sec-head.inst{background:var(--purple)}
  .sec-head.inst .mk{color:var(--ink);opacity:.85}
  .subtabs{display:flex;gap:0;margin-bottom:22px;border:2px solid var(--purple);width:fit-content;max-width:100%}
  .subtab{appearance:none;background:transparent;border:0;color:var(--cream);cursor:pointer;font:400 20px/1 var(--display);
    text-transform:uppercase;letter-spacing:.02em;padding:12px 20px 10px}
  .subtab+.subtab{border-left:2px solid var(--purple)}
  .subtab:hover{color:var(--purple)}
  .subtab[aria-selected="true"]{background:var(--purple);color:var(--ink)}
  .subtab:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  @media (max-width:520px){.subtabs{width:100%}.subtab{flex:1;font-size:16px;padding:11px 10px 9px}}

  /* store rail — one column per store in the selected week + brand */
  .layout{display:grid;grid-template-columns:minmax(0,1fr)}
  .layout.has-rail{grid-template-columns:212px minmax(0,1fr);gap:24px;align-items:start}
  .storecol{border:2px solid var(--purple);background:var(--ink-2);position:sticky;top:14px}
  .storecol-head{font:800 11px/1.35 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--purple);
    padding:10px 12px;border-bottom:2px solid var(--purple)}
  .storelink{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:0;cursor:pointer;
    color:var(--cream);padding:11px 12px 9px}
  .storelink+.storelink{border-top:1px solid #3a3a3a}
  .storelink .nm{display:block;font:400 19px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
  .storelink .ct{display:block;margin-top:4px;color:var(--muted)}
  .storelink.unnamed .nm{color:var(--muted)}
  .storelink:hover{color:var(--purple)}
  .storelink[aria-selected="true"]{background:var(--purple);color:var(--ink)}
  .storelink[aria-selected="true"] .nm,.storelink[aria-selected="true"] .ct{color:var(--ink)}
  .storelink[aria-selected="true"] .ct{opacity:.75}
  .storelink:focus-visible{outline:3px solid var(--pink);outline-offset:-3px}
  @media (max-width:900px){
    .layout.has-rail{grid-template-columns:minmax(0,1fr);gap:0}
    .storecol{position:static;margin-bottom:18px;overflow-x:auto}
    .storecol-head{display:none}
    .storecol nav{display:flex}
    .storelink{width:auto;white-space:nowrap}
    .storelink+.storelink{border-top:0;border-left:1px solid #3a3a3a}
  }
  .sec-head .mk{display:block;margin:0 0 4px;font:400 clamp(24px,2.7vw,36px)/1 var(--marker);color:var(--pink);
    transform:rotate(-5deg);transform-origin:100% 100%;opacity:.95;white-space:nowrap}
  .sec-head.project .mk{color:var(--ink);opacity:.85}
  .sec-body{background:var(--ink-2);padding:18px;display:grid;gap:18px}

  /* item card */
  .item{background:var(--cream);padding:18px 18px 20px}
  .item-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .code{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font:400 18px/1 var(--display);flex:none}
  .item h3{font:400 30px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
  .item .opt{font:400 16px/1 var(--marker);color:#c24fa6;transform:rotate(-3deg)}
  .item .note{margin-left:auto;max-width:46ch;text-align:right;font:600 13px/1.4 var(--body);color:var(--muted)}

  /* before / after – identical frames, identical heights */
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ba.tall{max-width:760px;margin:0 auto}
  .ba.tall .frame{aspect-ratio:3/4}
  .side-lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .chip{font:800 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px}
  .chip.before{background:var(--ink);color:var(--cream)}
  .chip.after{background:var(--pink);color:var(--ink)}
  .frame{aspect-ratio:var(--ratio);width:100%;background:#d7cec3;position:relative;overflow:hidden}
  .frame img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .35s ease}
  .frame img:hover{transform:scale(1.025)}
  .frame.empty{background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(17,17,17,.045) 10px 20px),#E4DBD1;
               outline:2px dashed rgba(17,17,17,.28);outline-offset:-8px;display:grid;place-items:center;text-align:center;padding:18px}
  .frame.empty .ph-big{font:400 clamp(20px,2.6vw,30px)/1 var(--display);text-transform:uppercase;color:rgba(17,17,17,.38)}
  .frame.empty .ph-path{margin-top:8px;font:600 11px/1.3 ui-monospace,Consolas,monospace;color:rgba(17,17,17,.45);word-break:break-all}
  .arrow{display:none}

  /* a line above a view: which fixture it is, and what is displayed on it */
  .viewtag{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin:0 0 9px}
  .viewtag .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .viewtag .vt{min-width:30px;height:22px;padding:0 8px;border-radius:99px;background:var(--ink);color:var(--cream);
    display:grid;place-items:center;font:800 10px/1 var(--body);letter-spacing:.06em;flex:none}
  .viewtag b{font:800 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:#6c655c}
  .viewtag i{font:400 20px/1.05 var(--marker);font-style:normal;color:#c24fa6;
    transform:rotate(-2deg);transform-origin:right center;display:inline-block;justify-self:end;text-align:right}
  /* in a gallery the views sit three abreast, so there is no After side to line up with */
  .gal .viewtag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .gal .viewtag i{font-size:16px;justify-self:auto;text-align:left;transform-origin:left center}
  .gal figure .viewtag{margin-bottom:8px}

  /* floor plan + zone pins */
  .plan-grid{display:grid;gap:14px}
  .plan-grid.two{grid-template-columns:1fr 1fr}
  .planfig{margin:0}
  .plantag{display:inline-block;font:800 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;
    padding:6px 9px;background:var(--ink);color:var(--cream);margin-bottom:8px}
  .planfig.now .plantag{background:var(--pink);color:var(--ink)}
  .planframe{aspect-ratio:auto;background:#fff;border:2px solid var(--ink)}
  .planframe img{height:auto;object-fit:contain;display:block}
  .planframe img:hover{transform:none}
  /* if the plan itself fails to load the box collapses, which bunches every pin into a strip
     and reads as a broken layout. Hold the height and hide the pins until the plan is there. */
  .planframe.failed{min-height:clamp(220px,34vw,420px)}
  .planframe.failed .pin{display:none}
  /* the dot marks the exact spot; the label sits beside it so it never covers the fixture */
  /* The CAD is already full of its own text, so the plan only carries a numbered dot.
     The reading happens in the list beside it; the tag appears on hover or a tap. */
  .pin{position:absolute;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;z-index:2}
  .pin .dot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;
    background:var(--pink);border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;
    font:800 10px/1 var(--body);box-shadow:0 1px 5px rgba(0,0,0,.4);transition:transform .14s ease}
  .pin .lbl{display:none;position:absolute;left:15px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:var(--ink);color:var(--cream);border-radius:3px;padding:5px 8px;
    font:800 11px/1.1 var(--body);letter-spacing:.02em;box-shadow:0 3px 14px rgba(0,0,0,.45)}
  .pin .lbl b{opacity:.6;margin-right:5px}
  .pin.flip .lbl{left:auto;right:15px}
  .pin:hover,.pin:focus-visible,.pin.lit{outline:none;z-index:8}
  .pin:hover .lbl,.pin:focus-visible .lbl,.pin.lit .lbl{display:block}
  .pin:hover .dot,.pin:focus-visible .dot,.pin.lit .dot{transform:scale(1.3)}
  .pin.lit .dot{background:var(--purple)}
  .pin.off .dot{background:#cfc6bb;color:#6c655c;box-shadow:0 1px 4px rgba(0,0,0,.2)}

  .planbody{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
  .planlist{display:grid;gap:2px}
  .planlist .hd{font:800 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;
    color:#6c655c;padding:0 8px 6px}
  .plrow{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;appearance:none;
    border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:4px;cursor:pointer}
  .plrow:hover,.plrow.lit{background:var(--purple)}
  .plrow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .plrow .no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pink);color:var(--ink);
    display:grid;place-items:center;font:800 10px/1 var(--body);border:2px solid var(--ink)}
  .plrow.off .no{background:#cfc6bb;color:#6c655c}
  .plrow .txt{min-width:0}
  .plrow .txt b{display:block;font:800 9px/1.4 var(--body);letter-spacing:.09em;text-transform:uppercase;color:#6c655c}
  .plrow .txt i{display:block;font:700 13px/1.3 var(--body);font-style:normal;color:var(--ink)}
  .plrow.off .txt i{color:#8d867e}
  .planhint{margin-top:10px;color:var(--muted)}
  .theme{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;
    border:1px solid rgba(17,17,17,.28);border-radius:99px;color:#4a443d;white-space:nowrap}
  .zonepin{appearance:none;border:0;cursor:pointer;background:var(--pink);color:var(--ink);
    padding:0 11px;height:26px;border-radius:99px;display:inline-grid;place-items:center;
    font:800 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase}
  .zonepin:hover{background:var(--purple)}
  .item.flash{outline:3px solid var(--purple);outline-offset:5px}
  @media (max-width:820px){
    .plan-grid.two{grid-template-columns:1fr}
    .planbody{grid-template-columns:1fr}
    .pin .lbl{font-size:10px;padding:4px 6px;left:13px}
    .pin.flip .lbl{right:13px}
  }

  /* ACC group */
  .group{border-top:2px solid var(--cream);padding-top:16px;display:grid;gap:18px}
  .group-head{display:flex;align-items:baseline;gap:14px;color:var(--cream)}
  .group-head .code{background:var(--pink);color:var(--ink)}
  .group-head h3{font:400 38px/1 var(--display);margin:0;text-transform:uppercase}
  .group-head .micro{color:#bdb6ae}
  .item.sub .code{background:transparent;border:2px solid var(--ink);color:var(--ink);width:auto;min-width:46px;padding:0 8px;border-radius:99px;font-size:15px}

  /* Project galleries */
  .gal-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .gal figure{margin:0}
  .gal figcaption{margin-top:8px;font:700 12px/1.4 var(--body);text-transform:uppercase;letter-spacing:.04em;min-height:1.4em}

  .empty-state{background:var(--cream);padding:40px 24px;text-align:center}
  .empty-state b{font:400 40px/1 var(--display);display:block;text-transform:uppercase}

  /* footer */
  footer{border-top:1px solid #2a2a2a;color:#bdb6ae}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:18px;padding-bottom:26px;flex-wrap:wrap}
  .barcode{height:26px;width:120px;background:repeating-linear-gradient(90deg,#bdb6ae 0 2px,transparent 2px 4px,#bdb6ae 4px 5px,transparent 5px 8px,#bdb6ae 8px 11px,transparent 11px 12px)}

  /* lightbox */
  .frame:has(img)::after{content:"⤢ ZOOM";position:absolute;right:8px;bottom:8px;background:rgba(17,17,17,.78);color:var(--cream);
    font:800 10px/1 var(--body);letter-spacing:.08em;padding:6px 8px;opacity:0;transition:opacity .2s;pointer-events:none}
  .frame:hover::after{opacity:1}
  @media (hover:none){.frame:has(img)::after{opacity:.85}}
  .frame.failed img{visibility:hidden}
  .frame.failed::after{content:"Image didn’t load — tap to retry";position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;opacity:1;pointer-events:auto;cursor:pointer;
    background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(17,17,17,.045) 10px 20px),#E4DBD1;
    font:400 clamp(14px,1.7vw,19px)/1.3 var(--display);text-transform:uppercase;letter-spacing:.03em;color:rgba(17,17,17,.5)}
  .frame.retrying::after{content:"Retrying…"}
  .lb{position:fixed;inset:0;background:rgba(10,10,10,.95);display:none;z-index:50}
  .lb.open{display:block}
  .lb .stage{position:absolute;inset:56px 0 52px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
  .lb .stage img{max-width:calc(100% - 120px);max-height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-drag:none;
    transform-origin:0 0;will-change:transform}
  .lb.zoomed .stage img{cursor:grab}
  .lb.dragging .stage img{cursor:grabbing}
  .lb .top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;color:var(--cream)}
  .lb .top .cap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .btn{background:none;border:1px solid #444;color:var(--cream);font:800 12px/1 var(--body);letter-spacing:.06em;padding:8px 11px;cursor:pointer}
  .lb .btn:hover{border-color:var(--pink);color:var(--pink)}
  .lb .x{background:none;border:0;color:var(--pink);font:400 40px/1 var(--display);cursor:pointer;padding:0 4px}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(17,17,17,.7);border:1px solid #444;color:var(--cream);
    width:48px;height:64px;font:400 30px/1 var(--display);cursor:pointer;z-index:2}
  .lb .nav:hover{color:var(--pink);border-color:var(--pink)}
  .lb .prev{left:10px}.lb .next{right:10px}
  .lb .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#8d8780}
  .lb button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  @media (max-width:520px){.lb .stage img{max-width:100%}.lb .nav{width:38px;height:52px;font-size:24px}}

  @media (max-width:820px){
    .hero .wrap{grid-template-columns:1fr}
    .hero .side{align-items:flex-start;text-align:left;flex-direction:row}
    .hero .ast,.hero .scribble{display:none}
    .sec-head{grid-template-columns:1fr;gap:8px;padding:18px 16px}
    .sec-head .aside{text-align:left}
    .sec-head .mk{transform:rotate(-3deg);transform-origin:0 100%;margin:10px 0 2px}
    .gal{grid-template-columns:1fr 1fr}
    .item .note{margin-left:0;text-align:left}
    .tab{min-width:0;flex:1;padding:10px 14px 8px}
  }
  @media (max-width:520px){
    .sec-body{padding:10px}
    .item{padding:14px 12px 16px}
    .ba{gap:8px}
    .item h3{font-size:24px}
    .gal{grid-template-columns:1fr}
    .frame.empty .ph-path{display:none}
  }
  @media print{
    .bar,.lb{display:none!important}
    body{background:#fff}
    .sec{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="hero">
  <svg class="spray" viewBox="0 0 520 160" aria-hidden="true">
    <path d="M10 92 C 90 60, 170 70, 250 84 S 420 108, 510 58" fill="none" stroke="#F68BDA" stroke-width="30" stroke-linecap="round" opacity=".75"/>
    <path d="M60 122 C 150 104, 240 126, 330 116" fill="none" stroke="#F68BDA" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <path d="M180 98 l 2 30 M300 104 l 1 26 M420 92 l 2 34" stroke="#F68BDA" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </svg>
  <span class="ast" aria-hidden="true">*</span>
  <div class="wrap">
    <div>
      <div class="micro" style="margin-bottom:14px">F&amp;F · Visual Merchandising</div>
      <h1>VMD<br>Weekly<br><span class="u">Report.</span></h1>
      <div class="micro" style="margin-top:22px">Floor update · Project<br><span style="border-bottom:2px solid var(--pink)">Every week.</span></div>
    </div>
    <div class="side">
      <div class="tag-week"><span id="heroWeek">W45</span><small id="heroRange">—</small></div>
    </div>
  </div>
</header>

<nav class="bar" aria-label="Report controls">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-brand="MLB" aria-selected="true">MLB <span class="micro">01</span></button>
      <button class="tab" role="tab" data-brand="DX" aria-selected="false">DX <span class="micro">02</span></button>
    </div>
    <div class="ctrls">
      <label class="micro" style="color:#bdb6ae" for="weekSel">Week</label>
      <select id="weekSel" class="ctrl" aria-label="Select week"></select>
      <div class="seg" role="group" aria-label="View mode">
        <button data-mode="report" aria-pressed="false" title="Hide sections without photos">Report</button>
        <button data-mode="template" aria-pressed="true" title="Show every slot">Template</button>
      </div>
    </div>
  </div>
</nav>

<main><div class="wrap" id="root"></div></main>

<footer>
  <div class="wrap">
    <div class="barcode" aria-hidden="true"></div>
    <div class="micro">Design is thinking made visual.</div>
    <div class="micro">EST. 2026 · VMD</div>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="top">
    <span class="cap micro" id="lbCap"></span>
    <span class="micro" id="lbCount" style="color:#8d8780"></span>
    <button class="btn" id="lbOut" aria-label="Zoom out">−</button>
    <button class="btn" id="lbIn" aria-label="Zoom in">+</button>
    <button class="btn" id="lbFit">FIT</button>
    <button class="x" id="lbX" aria-label="Close">×</button>
  </div>
  <div class="stage" id="lbStage"><img id="lbImg" alt="" draggable="false"></div>
  <button class="nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <button class="nav next" id="lbNext" aria-label="Next photo">›</button>
  <div class="hint micro">Click photo or scroll to zoom · drag to move · ← → next photo · Esc close</div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const DATA = window.VMD_REPORT || {weeks:[]};
  const FLOOR = [
    {k:'A', t:'Entrance',     f:'A Entrance'},
    {k:'A1', code:'A-1', t:'VP Zone', f:'A-1 VP Zone', sub:true},
    {k:'B', t:'Overview',     f:'B Overview'},
    {k:'C', t:'Main Wall',    f:'C Main Wall'},
    {k:'D', t:'Sub Wall',     f:'D Sub Wall'},
    {k:'E', t:'3rd Wall',     f:'E 3rd Wall (optional)', opt:true},
    {k:'E4', code:'E-4', t:'4th Wall', f:'E-4 4th Wall (optional)', opt:true},
    {k:'F', t:'Floor-stands', f:'F Floor-stands'}
  ];
  const ACC = [
    {k:'G1', code:'G-1', t:'CP Wall', f:'G-1 ACC - CP Wall'},
    {k:'G2', code:'G-2', t:'BG Wall', f:'G-2 ACC - BG Wall'},
    {k:'G3', code:'G-3', t:'SH Wall', f:'G-3 ACC - SH Wall'}
  ];
  const MARK = 'then → now';   // shared decorative mark (both brands)

  // brands that split into sub-tabs (others show everything on one page)
  const SUBTABS = { DX: [ {k:'vmd', t:'Weekly VMD'}, {k:'inst', t:'Installation / Production'} ] };
  const state = {brand:'MLB', week:null, mode:null, view:'vmd', store:0};
  // pins of the store being rendered, so baCard can badge the zones that sit on the plan
  let PINS = {}, PINS_ORDERED = false, PLAN_THEMES = {};
  const $ = s => document.querySelector(s);
  // Weeks built before stores existed carry one unnamed store at the brand level.
  const storesOf = B => !B ? [] : (B.stores || ((B.floor||B.project) ? [{name:B.store||'', floor:B.floor, project:B.project}] : []));
  const storeSlug = n => String(n||'').replace(/[^A-Za-z0-9]+/g,'').toLowerCase() || 'store';
  const storesFor = (week, brand) => {
    const wk = DATA.weeks.find(x=>x.week===week);
    return wk ? storesOf((wk.brands||{})[brand]) : [];
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ----- routing (#W45/MLB) -----
  function readHash(){
    const parts = location.hash.replace('#','').split('/');
    const [w,b] = parts;
    if (DATA.weeks.some(x=>x.week===w)) state.week = w;
    if (b==='MLB'||b==='DX') state.brand = b;
    const subs = SUBTABS[state.brand]||[];
    const rest = parts.slice(2).filter(Boolean);
    // links made before stores existed look like #W45/DX/vmd — no store segment
    if (rest.length && subs.some(s=>s.k===rest[0])){
      state.store = 0; state.view = rest[0];
    } else {
      const i = storesFor(state.week, state.brand).findIndex(s=>storeSlug(s.name)===rest[0]);
      state.store = i >= 0 ? i : 0;
      state.view = subs.some(s=>s.k===rest[1]) ? rest[1] : 'vmd';
    }
    if (!subs.some(s=>s.k===state.view)) state.view = 'vmd';
  }
  function writeHash(){
    const list = storesFor(state.week, state.brand);
    const seg = (list.length > 1 && list[state.store]) ? '/'+storeSlug(list[state.store].name) : '';
    history.replaceState(null,'',`#${state.week}/${state.brand}${seg}${SUBTABS[state.brand]?'/'+state.view:''}`);
  }

  // ----- builders -----
  function frame(src, label, hint){
    if (src) return `<div class="frame"><img src="${esc(src)}" alt="${esc(label)}" loading="lazy" data-cap="${esc(label)}"></div>`;
    return `<div class="frame empty"><div><div class="ph-big">No ${esc(label.split(' · ').pop())} image</div><div class="ph-path">${esc(hint)}</div></div></div>`;
  }
  // a slot holds one or more before/after pairs (older data used flat before/after)
  const pairsOf = s => !s ? [] : (s.pairs || ((s.before||s.after) ? [{before:s.before, after:s.after}] : []));
  // pins.json may hold, per zone: [x,y] | {at,name} | a list of either. One shape out.
  function pinList(v){
    const arr = (Array.isArray(v) && typeof v[0] === 'number') ? [v] : (Array.isArray(v) ? v : [v]);
    return arr.map(q => Array.isArray(q) ? {x:+q[0], y:+q[1], name:typeof q[2]==='string'?q[2]:'', fixture:''}
                      : (q && typeof q === 'object' ? {x:+q.x, y:+q.y, name:q.name||'', fixture:q.fixture||''} : null))
              .filter(q => q && isFinite(q.x) && isFinite(q.y));
  }
  // F -> F1 F2 F3, but A-1 -> A-1·1 A-1·2: a code that already ends in a digit needs a separator
  const pinLabel = (code, i, n) => n > 1 ? code + ("0123456789".indexOf(code.slice(-1)) >= 0 ? '·' : '') + (i + 1) : code;

  // the pins of a zone, and just their theme names
  const pinsOfZone = k => !k || !PINS[k] ? [] : pinList(PINS[k]);
  const pinNames = k => pinsOfZone(k).map(q=>q.name).filter(Boolean);
  // "Floor Stand 2A" and "floor stand 2a" are the same fixture
  const fixKey = t => String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');

  // The store's floor plan, with a pin per zone. Pins are fractions of the image (0..1), set
  // once per store in tools/plan-pins.html, so nothing here has to be redone each week.
  function planPanel(S){
    const P = S.plan;
    if (!P || !P.src) return '';
    const ALL = FLOOR.concat(ACC);
    // a zone can sit in several places — "F Floor-stands" is three sets of stands — and each
    // pin can name what is displayed there ("Karina", "Wellness")
    const spots = [];
    Object.entries(P.pins||{}).forEach(([k,v])=>{
      const z = ALL.find(x=>x.k===k); if(!z) return;
      const arr = pinList(v), said = (P.themeByFixture||{})[k] || {};
      arr.forEach(q => { const t = q.fixture && said[fixKey(q.fixture)]; if (t) q.name = t; });
      arr.forEach((q,i)=>spots.push({k, z, q, live:has((S.floor||{})[k]),
        lbl:pinLabel(z.code||z.k, i, arr.length), id:'pin-'+k+(i?'-'+(i+1):'')}));
    });
    spots.forEach((o,i)=>{ o.no = i + 1; });
    // the plan is dense, so a dot on the right half opens its tag to the left
    const pins = spots.map(o=>`<button class="pin${o.live?'':' off'}${o.q.x>0.58?' flip':''}" id="${esc(o.id)}" data-zone="${esc(o.k)}"
        style="left:${(o.q.x*100).toFixed(2)}%;top:${(o.q.y*100).toFixed(2)}%"
        title="${esc(o.no+'. '+o.lbl+' · '+o.z.t+(o.q.name?' — '+o.q.name:''))}${o.live?'':' — no photos this week'}"><span class="dot">${o.no}</span><span class="lbl"><b>${esc(o.lbl)}</b>${esc(o.q.name||o.z.t)}</span></button>`).join('');
    const rows = spots.map(o=>`<button class="plrow${o.live?'':' off'}" data-pin="${esc(o.id)}" data-zone="${esc(o.k)}"
        title="${o.live?'Go to this zone':'No photo this week'}"><span class="no">${o.no}</span><span class="txt"><b>${esc(o.lbl)} · ${esc(o.z.t)}</b><i>${esc(o.q.name||'—')}</i></span></button>`).join('');
    const n = spots.length;
    const who = S.name || state.brand;
    const shot = (src, cap, over) => `<div class="frame planframe"><img src="${esc(src)}" alt="${esc(cap)}" data-cap="${esc(cap)}">${over||''}</div>`;
    const two = !!P.before;
    const old = two ? `<figure class="planfig"><span class="plantag">${esc(P.beforeLabel||'Previous zoning')}</span>
        ${shot(P.before, who+' · previous floor plan')}</figure>` : '';
    const now = `<figure class="planfig now"><span class="plantag">${esc(two?(P.afterLabel||'New zoning'):'Zoning')}</span>
        ${shot(P.src, who+' · floor plan', pins)}</figure>`;
    return `<article class="item" id="floorplan">
      <div class="item-head">
        <span class="code">◉</span>
        <h3>Floor plan</h3>
        ${two?'<span class="opt">zoning changed</span>':''}
        ${P.note?`<p class="note">${esc(P.note)}</p>`:''}
      </div>
      <div class="planbody">
        <div class="plan-grid${two?' two':''}">${old}${now}</div>
        ${n?`<div class="planlist"><div class="hd">What is where</div>${rows}</div>`:''}
      </div>
      ${n?'<p class="planhint micro">Hover or tap a number to show its tag on the plan. Click a line to jump to that zone. Grey means no photo this week.</p>':''}
    </article>`;
  }

  function baCard(slot, code, title, opts, folder, zkey){
    const s = slot || {};
    let pairs = pairsOf(s).filter(p=>p.before||p.after);
    if (!pairs.length) pairs = [{before:'',after:''}];
    const hint = side => `${state.brand} / ${folder} / ${side}`;
    const labels = s.labels || [], zpins = pinsOfZone(zkey);
    // A pin can say which fixture it sits on ("Floor Stand 2A"), which is how a view gets its
    // theme — order-independent and the only reliable link. Falling back to pin order needs the
    // store to have declared "ordered": true, because the orders do not match by default.
    const byFixture = {};
    zpins.forEach(q => { if (q.fixture && q.name) byFixture[fixKey(q.fixture)] = q.name; });
    // one view and one pin is unambiguous, so no fixture name is needed for it
    const only = (pairs.length === 1 && zpins.length === 1) ? (zpins[0].name || '') : '';
    const stated = PLAN_THEMES[zkey] || {};
    const themeFor = i => stated[fixKey(labels[i])] || byFixture[fixKey(labels[i])] || only ||
                          (PINS_ORDERED ? ((zpins[i]||{}).name || '') : '');
    const names = pairs.map((_,i) => themeFor(i));
    // Nothing to compare — the setting did not change, or no before was ever taken. Show the
    // photos as they stand, with no empty Before frames and no Before/After chips.
    const current = pairs.some(p=>p.after) && pairs.every(p=>!p.before);
    // which fixture this view is, and what is displayed on it
    const viewTag = i => {
      if (!labels[i] && !names[i]) return '';
      return `<div class="viewtag"><span class="who">${pairs.length>1?`<span class="vt">${esc(pinLabel(code,i,pairs.length))}</span>`:''}${
        labels[i]?`<b>${esc(labels[i])}</b>`:''}</span>${names[i]?`<i>${esc(names[i])}</i>`:''}</div>`;
    };
    // themes pinned to this zone that no view picked up
    const shown = new Set(names.filter(Boolean));
    const spare = zpins.map(q=>q.name).filter(n => n && !shown.has(n) &&
                    !Object.values(stated).includes(n));
    const body = current
      ? `<div class="gal">${pairs.map((p,i)=>`<figure>${viewTag(i)}${frame(p.after, `${code} ${title}`, hint('after'))}</figure>`).join('')}</div>`
      : pairs.map((p,i)=>`${viewTag(i)}<div class="ba${p.portrait?' tall':''}">
        <div><div class="side-lbl"><span class="chip before">Before${pairs.length>1?' '+(i+1):''}</span></div>${frame(p.before, `${code} ${title} · Before`, hint('before'))}</div>
        <div><div class="side-lbl"><span class="chip after">After${pairs.length>1?' '+(i+1):''}</span></div>${frame(p.after, `${code} ${title} · After`, hint('after'))}</div>
      </div>`).join('<div style="height:14px"></div>');
    return `<article class="item ${opts.sub?'sub':''}" id="zone-${esc(zkey||code)}">
      <div class="item-head">
        <span class="code">${esc(code)}</span>
        <h3>${esc(title)}</h3>
        ${(zkey&&PINS[zkey])?`<button class="zonepin" data-goplan="${esc(zkey)}" title="Show this zone on the floor plan">◉ on plan</button>`:''}
        ${spare.map(t=>`<span class="theme">${esc(t)}</span>`).join('')}
        ${current?'<span class="opt">current setting</span>':''}
        ${opts.opt?'<span class="opt">optional</span>':''}
        ${pairs.length>1?`<span class="micro" style="color:var(--muted)">${pairs.length} views</span>`:''}
        ${(s.note && labels.length < pairs.length)?`<p class="note">${esc(s.note)}</p>`:''}
      </div>
      ${body}
    </article>`;
  }
  const has = s => pairsOf(s).some(p=>p.before||p.after);
  const hasImg = arr => (arr||[]).some(x=>x && x.src);

  function gallery(list, label, code, folder, note){
    let items = (list||[]).filter(x=>x && x.src);
    if (!items.length && state.mode==='template') items = [{},{},{}];
    return `<article class="item">
      <div class="item-head"><span class="code">${code}</span><h3>${label}</h3>${note?`<p class="note">${esc(note)}</p>`:''}</div>
      <div class="gal">${items.map((x,i)=>`<figure>
        ${frame(x.src, `${label} ${i+1} · photo`, `${state.brand} / ${folder}`)}
        ${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`).join('')}</div>
    </article>`;
  }

  // ----- resilient images -----
  // The dashboard sits behind an auth redirect, so an image request made on a stale
  // session returns HTML instead of a JPEG and leaves a permanently dead icon.
  // Retry with backoff, then offer a manual retry rather than failing silently.
  const IMG_RETRIES = 3;
  function loadRetry(img){
    const frame = img.closest('.frame');
    const n = (+img.dataset.try || 0) + 1;
    if (n > IMG_RETRIES){ if (frame){ frame.classList.remove('retrying'); frame.classList.add('failed'); } return; }
    img.dataset.try = n;
    if (frame) frame.classList.add('retrying');
    if (!img.dataset.src) img.dataset.src = img.getAttribute('src').split('?')[0];
    setTimeout(()=>{ img.src = `${img.dataset.src}?r=${Date.now()}`; }, 500 * Math.pow(2, n-1));
  }
  function wireImages(root){
    root.querySelectorAll('.frame img').forEach(img=>{
      if (img.dataset.wired) return;
      img.dataset.wired = '1';
      img.addEventListener('error', ()=>loadRetry(img));
      img.addEventListener('load', ()=>{
        img.dataset.try = 0;
        const f = img.closest('.frame');
        if (f) f.classList.remove('failed','retrying');
      });
      if (img.complete && !img.naturalWidth) loadRetry(img);  // already failed before wiring
    });
  }
  // capture phase, so a retry tap never reaches the lightbox's own click handler
  $('#root').addEventListener('click', e=>{
    const f = e.target.closest('.frame.failed');
    if (!f) return;
    e.stopPropagation(); e.preventDefault();
    const img = f.querySelector('img');
    if (!img) return;
    img.dataset.try = 0;
    f.classList.remove('failed');
    loadRetry(img);
  }, true);

  function render(){
    const wk = DATA.weeks.find(w=>w.week===state.week);
    $('#heroWeek').textContent = wk ? wk.week : '—';
    $('#heroRange').textContent = wk ? `${wk.range} · ${wk.year}` : '';
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.brand===state.brand));
    document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===state.mode));
    if (!wk){ $('#root').innerHTML = `<div class="empty-state"><b>No report yet</b></div>`; return; }

    const B = (wk.brands||{})[state.brand] || {};
    const stores = storesOf(B);
    if (state.store >= stores.length) state.store = 0;
    const S = stores[state.store] || {name:'', floor:{}, project:{}};
    const tpl = state.mode==='template';
    const F = S.floor||{}, P = S.project||{};

    // floor
    PINS = (S.plan && S.plan.pins) || {};
    PINS_ORDERED = !!(S.plan && S.plan.ordered);
    PLAN_THEMES = (S.plan && S.plan.themeByFixture) || {};
    const floorCards = FLOOR.filter(x=>tpl||has(F[x.k])).map(x=>baCard(F[x.k],x.code||x.k,x.t,{opt:x.opt,sub:x.sub},x.f,x.k));
    const accCards = ACC.filter(x=>tpl||has(F[x.k])).map(x=>baCard(F[x.k],x.code,x.t,{sub:true},x.f,x.k));
    const planHtml = planPanel(S);
    const floorHtml = (floorCards.length||accCards.length||planHtml) ? `
      <section class="sec">
        <div class="sec-head floor">
          <span class="num">01</span>
          <h2>Floor <span class="u">update.</span></h2>
          <div class="aside micro">
            <span class="mk" aria-hidden="true">${MARK}</span>
            ${esc(state.brand)}${S.name?` · ${esc(S.name)}`:''}<br>${S.date?`Touch-up ${esc(S.date)}`:'Before → After'}</div>
        </div>
        <div class="sec-body">
          ${planHtml}
          ${floorCards.join('')}
          ${accCards.length?`<div class="group">
            <div class="group-head"><span class="code">G</span><h3>ACC</h3><span class="micro">CP · BG · SH wall</span></div>
            ${accCards.join('')}</div>`:''}
        </div>
      </section>` : '';

    const subs = SUBTABS[state.brand];
    const split = !!subs;                       // installation/production live in their own sub-tab
    const subBar = split ? `<div class="subtabs" role="tablist" aria-label="${esc(state.brand)} sections">${subs.map(s=>
      `<button class="subtab" role="tab" data-view="${s.k}" aria-selected="${s.k===state.view}">${esc(s.t)}</button>`).join('')}</div>` : '';

    // project (POP; plus installation/production when the brand has no sub-tab)
    const showPop = tpl || hasImg(P.pop);
    const showIns = !split && (tpl || hasImg(P.install));
    const showProd = !split && hasImg(P.production);
    const projHtml = (showPop||showIns||showProd) ? `
      <section class="sec">
        <div class="sec-head project">
          <span class="num">02</span>
          <h2><span class="u">Project.</span></h2>
          <div class="aside micro">
            <span class="mk" aria-hidden="true">ideas → impact</span>
            POP layout${split?'':'<br>Installation'}</div>
        </div>
        <div class="sec-body">
          ${showPop?gallery(P.pop,'POP Layout','2-1','2-1 POP Layout',P.popNote):''}
          ${showIns?gallery(P.install,'Installation','2-2','2-2 Installation',P.installNote):''}
          ${showProd?gallery(P.production,'Production','2-3','2-3 Production',P.productionNote):''}
        </div>
      </section>` : '';

    let body;
    if (split && state.view==='inst'){
      const sIns = tpl || hasImg(P.install), sProd = tpl || hasImg(P.production);
      body = (sIns||sProd) ? `
        <section class="sec">
          <div class="sec-head inst">
            <span class="num">03</span>
            <h2>Installation <span class="u">/ Production.</span></h2>
            <div class="aside micro">${esc(state.brand)}<br>On site · In production</div>
          </div>
          <div class="sec-body">
            ${sIns?gallery(P.install,'Installation','3-1','2-2 Installation',P.installNote):''}
            ${sProd?gallery(P.production,'Production','3-2','2-3 Production',P.productionNote):''}
          </div>
        </section>` :
        `<div class="empty-state"><b>No installation / production updates</b><p class="micro">${esc(state.brand)} · ${esc(wk.week)} · details coming soon</p></div>`;
    } else {
      body = (floorHtml+projHtml) ||
        `<div class="empty-state"><b>No updates this week</b><p class="micro">${esc(state.brand)} · ${esc(wk.week)}</p></div>`;
    }
    const zonesIn = s => FLOOR.concat(ACC).filter(x=>has((s.floor||{})[x.k])).length;
    const rail = stores.length ? `
      <aside class="storecol">
        <div class="storecol-head">Store</div>
        <nav role="tablist" aria-label="${esc(state.brand)} stores">${stores.map((s,i)=>{
          const n = zonesIn(s);
          return `<button class="storelink${s.name?'':' unnamed'}" role="tab" data-store="${i}" aria-selected="${i===state.store}">
            <span class="nm">${esc(s.name || 'Store not named')}</span>
            <span class="ct micro">${n ? `${n} zone${n>1?'s':''}` : 'no photos yet'}${s.date?` · ${esc(s.date)}`:''}</span>
          </button>`;
        }).join('')}</nav>
      </aside>` : '';

    $('#root').innerHTML = `<div class="layout${rail?' has-rail':''}">${rail}<div class="content">${subBar}${body}</div></div>`;
    wireImages($('#root'));
    $('#root').querySelectorAll('.subtab').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.view; render(); window.scrollTo({top:$('#root').offsetTop-80,behavior:'smooth'}); }));
    $('#root').querySelectorAll('.storelink').forEach(b=>b.addEventListener('click',()=>{ state.store=+b.dataset.store; render(); }));
    const jump = (el, cls) => { if(!el) return; el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 1800); };
    const clearLit = () => $('#root').querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'));
    const rowFor = id => $('#root').querySelector('.plrow[data-pin="'+id+'"]');
    $('#root').querySelectorAll('.pin').forEach(b=>{
      const row = rowFor(b.id);
      b.addEventListener('mouseenter', ()=>{ if (row) row.classList.add('lit'); });
      b.addEventListener('mouseleave', ()=>{ if (row) row.classList.remove('lit'); });
      b.addEventListener('click', e=>{
        e.stopPropagation();
        // the tag itself is the way through to the photos; the dot just shows it
        if (e.target.closest('.lbl')) { jump(document.getElementById('zone-'+b.dataset.zone), 'flash'); return; }
        const on = !b.classList.contains('lit');
        clearLit();
        if (on){ b.classList.add('lit'); if (row) row.classList.add('lit'); }
      });
    });
    $('#root').querySelectorAll('.plrow').forEach(r=>{
      const pin = document.getElementById(r.dataset.pin);
      r.addEventListener('mouseenter', ()=>{ if (pin) pin.classList.add('lit'); });
      r.addEventListener('mouseleave', ()=>{ if (pin) pin.classList.remove('lit'); });
      r.addEventListener('click', ()=>jump(document.getElementById('zone-'+r.dataset.zone), 'flash'));
    });
    $('#root').querySelectorAll('.zonepin').forEach(b=>b.addEventListener('click', ()=>
      jump(document.getElementById('pin-'+b.dataset.goplan), 'lit')));
    writeHash();
  }

  // ----- init -----
  const sel = $('#weekSel');
  sel.innerHTML = DATA.weeks.map(w=>`<option value="${esc(w.week)}">${esc(w.week)} · ${esc(w.range)}</option>`).join('');
  state.week = DATA.weeks[0] && DATA.weeks[0].week;
  readHash();
  const curWk = () => DATA.weeks.find(w=>w.week===state.week) || {};
  state.mode = curWk().template ? 'template' : 'report';
  sel.value = state.week;

  sel.addEventListener('change', e=>{ state.week=e.target.value; state.store=0; state.mode = curWk().template?'template':'report'; render(); });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ if(state.brand!==t.dataset.brand){ state.view='vmd'; state.store=0; } state.brand=t.dataset.brand; render(); }));
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ state.mode=b.dataset.mode; render(); }));
  window.addEventListener('hashchange',()=>{
    const prev = state.week; readHash(); sel.value = state.week;
    if (state.week !== prev) state.mode = curWk().template ? 'template' : 'report';
    render();
  });

  // lightbox
  // ----- lightbox with zoom + pan -----
  const lb=$('#lb'), lbImg=$('#lbImg'), lbCap=$('#lbCap'), stage=$('#lbStage');
  let list=[], idx=0, z=1, tx=0, ty=0, drag=null, moved=false;
  const apply=()=>{ lbImg.style.transform=`translate(${tx}px,${ty}px) scale(${z})`; lb.classList.toggle('zoomed', z>1); };
  const reset=()=>{ z=1; tx=0; ty=0; apply(); };
  // zoom keeping the point (cx,cy) on screen still
  function zoomAt(nz, cx, cy){
    nz=Math.min(6, Math.max(1, nz));
    const r=lbImg.getBoundingClientRect();
    const ox=r.left-tx, oy=r.top-ty;           // image position without translate
    const px=(cx-r.left)/z, py=(cy-r.top)/z;   // point in unscaled image px
    z=nz; tx=cx-ox-px*z; ty=cy-oy-py*z;
    if (z===1){ tx=0; ty=0; }
    apply();
  }
  const center=()=>{ const r=stage.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; };
  function show(i){
    idx=(i+list.length)%list.length; const img=list[idx];
    lbImg.src=img.src; lbImg.alt=img.alt; lbCap.textContent=img.dataset.cap||'';
    $('#lbCount').textContent=`${idx+1} / ${list.length}`; reset();
  }
  $('#root').addEventListener('click', e=>{
    const img=e.target.closest('.frame img'); if(!img) return;
    list=[...document.querySelectorAll('#root .frame img')]; lb.classList.add('open'); show(list.indexOf(img));
  });
  const close=()=>{ lb.classList.remove('open'); reset(); };
  $('#lbX').addEventListener('click', close);
  $('#lbPrev').addEventListener('click', ()=>show(idx-1));
  $('#lbNext').addEventListener('click', ()=>show(idx+1));
  $('#lbIn').addEventListener('click', ()=>zoomAt(z*1.6, ...center()));
  $('#lbOut').addEventListener('click', ()=>zoomAt(z/1.6, ...center()));
  $('#lbFit').addEventListener('click', reset);
  stage.addEventListener('click', e=>{
    if (moved) return;
    if (e.target!==lbImg){ if(z===1) close(); return; }
    z>1 ? reset() : zoomAt(2.5, e.clientX, e.clientY);
  });
  stage.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(z*(e.deltaY<0?1.2:1/1.2), e.clientX, e.clientY); }, {passive:false});
  stage.addEventListener('pointerdown', e=>{ moved=false; if(z>1){ drag={x:e.clientX-tx,y:e.clientY-ty,sx:e.clientX,sy:e.clientY}; stage.setPointerCapture(e.pointerId); lb.classList.add('dragging'); } });
  stage.addEventListener('pointermove', e=>{ if(!drag) return; if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4) moved=true; tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); });
  const endDrag=()=>{ drag=null; lb.classList.remove('dragging'); };
  stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowRight') show(idx+1);
    else if(e.key==='ArrowLeft') show(idx-1);
    else if(e.key==='+'||e.key==='=') zoomAt(z*1.6, ...center());
    else if(e.key==='-') zoomAt(z/1.6, ...center());
  });

  render();
})();
</script>
</body>
</html>
